<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Playback</title>
<link rel="stylesheet" href="cf.css">
<script src="views.js"></script>
<script src="data/playback.js"></script>
<style>
 body{background:#fff;display:flex;flex-direction:column;gap:14px;padding:14px 16px}
 .code{font-size:14.5px;line-height:1.7;flex:none}
 .stage{flex:1;position:relative;border:1px solid var(--line);border-radius:12px;min-height:0;display:flex;flex-direction:column}
 .stage .h{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);font-weight:600;font-size:16px}
 .stage .h span{font-weight:400;color:var(--muted);font-size:14px}
 .arr{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:10px}
 .arr svg.flash{animation:flash .35s}
 .cell{position:absolute;top:50%;width:80px;height:80px;margin-top:-52px;border:2.5px solid #64748b;background:#fff;display:grid;place-items:center;font-size:32px;font-weight:500}
 .cell.cmp{border-color:var(--orange);background:#fff7e6;border-width:3.5px}
 .anim .cell{transition:left .55s cubic-bezier(.4,.1,.2,1),background .25s,border-color .25s}
 .flash{animation:flash .35s}
 @keyframes flash{0%{opacity:0}100%{opacity:1}}
 .idx{position:absolute;top:50%;margin-top:40px;width:80px;text-align:center;color:var(--red);font-size:18px}
 .ctl{display:flex;align-items:center;gap:8px;flex:none}
 .ctl .lab{font-weight:600;font-size:16px;margin:0 6px;min-width:96px}
 .ctl .sp{flex:1}
 .tg{display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer;user-select:none}
 .tg i{width:40px;height:22px;border-radius:12px;background:#d1d5db;position:relative;transition:.15s}
 .tg i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
 .tg.on i{background:var(--blue)} .tg.on i::after{left:21px}
</style></head>
<body>
<div class="code" id="code"></div>
<div class="stage"><div class="h">data <span id="what"></span></div><div class="arr anim" id="arr"></div></div>
<div class="ctl"><button class="btn" id="prev">←</button><button class="btn primary" id="play">▶ Play</button><button class="btn" id="next">→</button><span class="lab" id="lab"></span><span class="sp"></span><label class="tg on" id="tg"><i></i>Match by id</label></div>
<script>
const V = CFV, P = CFD.playback, $ = (id) => document.getElementById(id);
const CODE = P.code.trimEnd().split("\n").map((t) => t.replace("data[j + 1], data[j]", "data[j+1], data[j]").replace("data[j], data[j + 1] =", "data[j], data[j+1] =").replace("data[j] > data[j + 1]", "data[j] > data[j+1]"));
const ST = P.steps;
let k = 0, timer = null, anim = true, K = null;
const esc = (s) => s.replace(/</g, "&lt;");
const hl = (t) => esc(t).replace(/\b(for|in|if)\b/g, '<span class="kw">$1</span>').replace(/\b(range|len)\b/g, '<span class="fn">$1</span>').replace(/\b(\d+)\b/g, '<span class="num">$1</span>');
function place(svgStr){
  const el = $("arr");
  const old = {}; el.querySelectorAll("g[data-k]").forEach((g) => { const r = g.getBoundingClientRect(); old[g.dataset.k] = [r.left, r.top]; });
  el.innerHTML = V.uniq(svgStr, "pb-"); const sv = el.querySelector("svg"); const [w, h] = V.size(sv);
  if (!sv.getAttribute("viewBox")) sv.setAttribute("viewBox", `0 0 ${w} ${h}`);
  if (K === null) K = Math.min(2.6, (el.clientWidth - 20) / w, (el.clientHeight - 20) / h);
  sv.setAttribute("width", w * K); sv.setAttribute("height", h * K);
  if (!anim) { sv.classList.remove("flash"); void sv.getBoundingClientRect(); sv.classList.add("flash"); return; }
  sv.querySelectorAll("g[data-k]").forEach((g) => { const o = old[g.dataset.k]; if (!o) return; const r = g.getBoundingClientRect(); const dx = (o[0] - r.left) / K, dy = (o[1] - r.top) / K;
    if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) return; g.style.transition = "none"; g.style.transform = `translate(${dx}px, ${dy}px)`;
    requestAnimationFrame(() => requestAnimationFrame(() => { g.style.transition = "transform .6s cubic-bezier(.4,.1,.2,1)"; g.style.transform = "translate(0px, 0px)"; })); });
}
function render(){
  const s = ST[k];
  $("code").innerHTML = CODE.map((t, i) => `<div class="ln${i + 1 === s.line ? " hl" : ""}"><span class="n">${i + 1}</span><span>${hl(t)}</span></div>`).join("");
  place(s.svg);
  $("lab").textContent = `Step ${k + 1} of ${ST.length}`; $("what").textContent = k === 0 ? "created" : "swap";
}
function go(n){ const nk = Math.max(0, Math.min(ST.length - 1, n)); if (nk === k && n !== 0) return; k = nk; render(); }
$("prev").onclick = () => go(k - 1); $("next").onclick = () => go(k + 1);
$("play").onclick = () => { if (timer) { clearInterval(timer); timer = null; $("play").textContent = "▶ Play"; return; } if (k >= ST.length - 1) { k = 0; render(); }
  $("play").textContent = "❚❚ Pause"; timer = setInterval(() => { if (k >= ST.length - 1) { $("play").click(); return; } go(k + 1); }, 1100); };
$("tg").onclick = () => { anim = !anim; $("tg").classList.toggle("on", anim); };
addEventListener("keydown", (e) => { if (e.key === "ArrowRight") go(k + 1); if (e.key === "ArrowLeft") go(k - 1); });
addEventListener("resize", () => { K = null; render(); });
render();
</script>
</body></html>

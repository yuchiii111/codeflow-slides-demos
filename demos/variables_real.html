<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Variables</title>
<style>
 html,body{margin:0;height:100%;background:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;overflow:hidden}
 body{display:flex;gap:18px;padding:0 12px;align-items:stretch}
 .left{width:800px;flex:none;position:relative;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;overscroll-behavior:contain}
 .left::-webkit-scrollbar{width:10px}.left::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:6px}
 .left .cam{position:relative;width:790px}
 .left img{display:block;width:790px}
 .hot{position:absolute;border-radius:10px;cursor:pointer;box-shadow:0 0 0 3px rgba(245,158,11,.9);animation:pulse 1.6s infinite}
 @keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(245,158,11,.9)}50%{box-shadow:0 0 0 7px rgba(245,158,11,.25)}}
 .right{flex:1;display:flex;align-items:center;justify-content:center;min-width:0}
 .ph{width:100%;max-width:780px;height:470px;flex-direction:column;border:2px dashed #d1d5db;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#9ca3af;font-size:20px;text-align:center;line-height:1.6}
 .dlg{display:none;width:100%;max-width:798px;border-radius:12px;box-shadow:0 18px 50px rgba(15,23,42,.22);animation:pop .35s}
 @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
 .reset{position:fixed;right:10px;bottom:8px;border:1px solid #d1d5db;background:#fff;border-radius:8px;font-size:13px;color:#6b7280;padding:3px 9px;cursor:pointer;opacity:.5}
 .reset:hover{opacity:1}
</style></head>
<body>
<div class="left"><div class="cam" id="cam"><img id="img" src="img/var_s1.png" alt="Code and Variables cards"><div id="hots"></div></div></div>
<div class="right"><div class="ph" id="ph"><div>Watch settings</div><div style="font-size:16px">opens from the ⚙ of a watched variable</div></div><img class="dlg" id="dlg" src="img/var_dialog.png" alt="Watch settings dialog"></div>
<button class="reset" id="reset">↺ reset</button>
<script>
// state: image, camera offset (px from top), hotspots [x, y, w, h, next]
const H = () => document.querySelector(".left").clientHeight;
const S = {
  s1: { img: "img/var_s1.png", h: 975, cam: "bottom", hots: [[592, 755, 180, 38, "s2"]] },
  s2: { img: "img/var_s2.png", h: 1070, cam: "top", hots: [[190, 236, 86, 30, "s3"]] },
  s3: { img: "img/var_s3.png", h: 1070, cam: "bottom", hots: [[614, 886, 46, 44, "dlg"]] },
};
let cur = "s1";
["s1", "s2", "s3"].forEach((k) => { const i = new Image(); i.src = S[k].img; });
function go(k){
  if (k === "dlg") { document.getElementById("ph").style.display = "none"; const d = document.getElementById("dlg"); d.style.display = "block"; d.style.animation = "none"; void d.offsetWidth; d.style.animation = ""; document.getElementById("hots").innerHTML = ""; return; }
  cur = k; const s = S[k];
  document.getElementById("img").src = s.img;
  const y = s.cam === "top" ? 0 : Math.max(0, s.h - H());
  const L = document.querySelector(".left"); setTimeout(() => L.scrollTo({ top: y, behavior: "smooth" }), 60);
  const hs = document.getElementById("hots"); hs.innerHTML = "";
  s.hots.forEach(([x, yy, w, h, nx]) => { const d = document.createElement("div"); d.className = "hot"; Object.assign(d.style, { left: x + "px", top: yy + "px", width: w + "px", height: h + "px" }); d.onclick = () => go(nx); hs.append(d); });
}
document.getElementById("reset").onclick = () => { document.getElementById("dlg").style.display = "none"; document.getElementById("ph").style.display = "flex"; go("s1"); };
addEventListener("resize", () => go(cur));
go("s1");
</script>
</body></html>

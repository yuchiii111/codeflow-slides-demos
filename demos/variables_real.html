<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Variables</title>
<style>
 html,body{margin:0;height:100%;background:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;overflow:hidden}
 body{display:flex;gap:18px;padding:0 12px;align-items:stretch}
 .left{width:727px;flex:none;position:relative;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
 .left::-webkit-scrollbar{width:10px}.left::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:6px}
 .stage{position:relative;width:715px}
 .stage img{display:block;width:715px}
 .right{flex:1;display:flex;align-items:center;justify-content:center;min-width:0}
 .dwrap{position:relative;width:740px;max-width:100%;display:none;animation:pop .3s}
 .dwrap img{display:block;width:100%;border-radius:10px;box-shadow:0 18px 50px rgba(15,23,42,.22)}
 @keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
 .hot{position:absolute;cursor:pointer;border-radius:8px}
 .hot:hover{box-shadow:0 0 0 2px rgba(22,119,255,.55)}
 .hot.guide{box-shadow:0 0 0 3px rgba(245,158,11,.9);animation:pulse 1.6s infinite}
 @keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(245,158,11,.9)}50%{box-shadow:0 0 0 7px rgba(245,158,11,.25)}}
 .reset{position:fixed;right:14px;top:12px;border:1px solid #d1d5db;background:#fff;border-radius:8px;font-size:15px;color:#374151;padding:6px 12px;cursor:pointer;box-shadow:0 2px 8px rgba(15,23,42,.08)}
 .reset:hover{border-color:#1677ff;color:#1677ff}
</style></head>
<body>
<div class="left" id="left"><div class="stage"><img id="img" alt="Code and Variables"><div id="hots"></div></div></div>
<div class="right"><div class="dwrap" id="dwrap"><img id="dimg" alt="Watch settings"><div id="dhots"></div></div></div>
<button class="reset" id="reset">↺ Start over</button>
<script>
// [x, y, w, h, target, guide?]
const L = {
  s0:   { img: "img/v_s0.png",   hots: [[549, 627, 95, 33, "s1", 1]] },
  s1:   { img: "img/v_s1.png",   hots: [[549, 627, 95, 33, "s0"], [552, 660, 158, 30, "sel0", 1], [552, 693, 158, 30, "adv1", 1]] },
  adv1: { img: "img/v_adv1.png", hots: [[570, 85, 33, 33, "adv2", 1], [611, 85, 33, 33, "s0"]] },
  adv2: { img: "img/v_adv2.png", hots: [[455, 697, 188, 32, "s0", 1]] },
  sel0: { img: "img/v_sel0.png", hots: [[126, 272, 46, 22, "sel1", 1], [502, 715, 141, 33, "s0"]] },
  sel1: { img: "img/v_sel1.png", hots: [[126, 314, 74, 22, "sel2", 1], [502, 715, 141, 33, "s0"]] },
  sel2: { img: "img/v_sel2.png", hots: [[126, 336, 82, 22, "sel3", 1], [502, 715, 141, 33, "s0"]] },
  sel3: { img: "img/v_sel3.png", hots: [[163, 785, 28, 28, "d:graph"], [369, 785, 28, 28, "d:frontier", 1], [575, 785, 28, 28, "d:best_cost"], [502, 715, 141, 33, "s0"]] },
};
const items = [[31, 176, 204, 42, "d:graph"], [31, 221, 204, 42, "d:frontier"], [31, 267, 204, 42, "d:best_cost"]];
const close = [[694, 14, 38, 38, "x"], [500, 406, 78, 34, "x"]];
const D = {
  graph:       { img: "img/v_dlg_graph.png", h: 368, hots: [...items, [694, 14, 38, 38, "x"], [500, 314, 78, 34, "x"]] },
  frontier:    { img: "img/v_dlg_frontier.png", h: 460, hots: [...items, ...close, [268, 167, 450, 34, "d:frontier_dd", 1]] },
  frontier_dd: { img: "img/v_dlg_frontier_dd.png", h: 460, hots: [[270, 208, 444, 68, "d:frontier"], [694, 14, 38, 38, "x"]] },
  best_cost:   { img: "img/v_dlg_best_cost.png", h: 460, hots: [...items, ...close] },
};
Object.values(L).concat(Object.values(D)).forEach((s) => { const i = new Image(); i.src = s.img; });
const $ = (id) => document.getElementById(id);
let cur = "s0";
function mk(box, hots){ box.innerHTML = ""; hots.forEach(([x, y, w, h, t, g]) => { const d = document.createElement("div"); d.className = "hot" + (g ? " guide" : ""); Object.assign(d.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" }); d.onclick = (e) => { e.stopPropagation(); act(t); }; box.append(d); }); }
function show(k){
  cur = k; const s = L[k]; $("img").src = s.img; mk($("hots"), s.hots);
  const g = s.hots.find((h) => h[5]) || s.hots[0]; const left = $("left");
  const want = Math.max(0, Math.min(960 - left.clientHeight, g[1] - left.clientHeight / 2));
  left.scrollTo({ top: want, behavior: "smooth" });
}
function dialog(k){
  const s = D[k], w = $("dwrap"); w.style.display = "block"; $("dimg").src = s.img;
  const scale = w.clientWidth / 740; const hs = s.hots.map(([x, y, ww, h, t, g]) => [x * scale, y * scale, ww * scale, h * scale, t, g]); mk($("dhots"), hs);
}
function act(t){
  if (t === "x") { $("dwrap").style.display = "none"; return; }
  if (t.startsWith("d:")) { dialog(t.slice(2)); return; }
  show(t);
}
$("reset").onclick = () => { $("dwrap").style.display = "none"; show("s0"); };
show("s0");
</script>
</body></html>

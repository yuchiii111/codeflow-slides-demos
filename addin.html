function pick(){

function choose(k){

let DESIGN_W = 1500, MASKS = [], CROP = null;

}
window.addEventListener('resize', fit);
function start(){ const qd = new URLSearchParams(location.search).get('demo'); if (qd) { show(qd); return; } const k = settings ? settings.get('demo') : (()=>{ try { return localStorage.getItem('cf-demo'); } catch(e){ return null; } })(); k ? show(k) : pick(); }

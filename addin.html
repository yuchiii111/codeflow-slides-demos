let settings = null;
function show(key){
  const d = DEMOS[key]; if(!d){ pick(); return; }
  document.getElementById('pick').hidden = true;
  const f = document.getElementById('f'); f.hidden = false; if (f.src !== d[1]) f.src = d[1];
  document.getElementById('chg').hidden = false;
}
function pick(){
  document.getElementById('f').hidden = true; document.getElementById('chg').hidden = true;
  const list = document.getElementById('list'); list.innerHTML = '';
  Object.entries(DEMOS).forEach(([k,[name]]) => { const b = document.createElement('button'); b.textContent = name; b.onclick = () => choose(k); list.append(b); });
  document.getElementById('pick').hidden = false;
}
function choose(k){
  if (settings) { settings.set('demo', k); settings.saveAsync(() => show(k)); } else { try { localStorage.setItem('cf-demo', k); } catch(e){} show(k); }
}
document.getElementById('chg').onclick = pick;
function start(){ const k = settings ? settings.get('demo') : (()=>{ try { return localStorage.getItem('cf-demo'); } catch(e){ return null; } })(); k ? show(k) : pick(); }
if (window.Office) { Office.onReady(() => { try { settings = Office.context.document.settings; } catch(e) { settings = null; } start(); }); setTimeout(() => { if (!document.getElementById('pick').hidden || !document.getElementById('f').hidden) return; start(); }, 3000); }
